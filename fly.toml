# fly.toml
# NOTA: al correr "fly launch" este archivo se genera/edita automáticamente.
# Este es solo un ejemplo de referencia — revisa "app" y "primary_region"
# con los valores reales que elijas durante "fly launch".

app = "concursos-mat"        # cámbialo por el nombre que uses en fly launch
primary_region = "qro"       # región más cercana a Perú suele ser qro (México) o gru (Brasil)

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
